spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/clinicqueue?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:clinic_user}
    password: ${DB_PASSWORD:clinic_pass}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
server:
  port: 8080
app:
  jwt:
    secret: ${JWT_SECRET:clinicqueue-local-demo-secret-key-change-before-production-2026}
    expiration-ms: 86400000
